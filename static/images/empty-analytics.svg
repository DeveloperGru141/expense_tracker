<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="160">
  <defs>
    <linearGradient id="empty-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#115e59" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="18" fill="url(#empty-grad)"/>
  
  <!-- Human-like Character searching -->
  <g transform="translate(160, 40)">
    <circle cx="20" cy="15" r="12" fill="#e2e8f0" opacity="0.9"/>
    <path d="M 5 30 Q 20 28 35 30 L 38 70 Q 20 75 2 70 Z" fill="#94a3b8" opacity="0.6"/>
    <!-- Arm with magnifying glass -->
    <g transform="translate(30, 40) rotate(-30)">
       <circle r="15" fill="none" stroke="#e2e8f0" stroke-width="3" opacity="0.9"/>
       <line x1="10" y1="10" x2="25" y2="25" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    </g>
  </g>

  <g transform="translate(200, 80)" stroke="#2dd4bf" stroke-linecap="round" fill="none">
    <circle r="45" stroke-dasharray="3 5" opacity="0.2" stroke-width="1.5"/>
    <circle r="30" stroke-dasharray="2 3" opacity="0.3" stroke-width="1"/>
  </g>
</svg>
