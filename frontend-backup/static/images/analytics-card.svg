<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="160">
  <defs>
    <linearGradient id="analytics-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#115e59" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bar-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="18" fill="url(#analytics-grad)"/>
  
  <!-- Human-like Character -->
  <g transform="translate(40, 40)">
    <!-- Head -->
    <circle cx="20" cy="20" r="12" fill="#e2e8f0" opacity="0.9"/>
    <!-- Body -->
    <path d="M 5 35 Q 20 32 35 35 L 38 75 Q 20 80 2 75 Z" fill="#67e8f9" opacity="0.7"/>
    <!-- Arm pointing -->
    <path d="M 35 45 L 65 30" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Data Visuals -->
  <g transform="translate(140, 110)">
    <rect x="0" y="-30" width="12" height="30" rx="3" fill="url(#bar-gradient)" opacity="0.4"/>
    <rect x="25" y="-55" width="12" height="55" rx="3" fill="url(#bar-gradient)" opacity="0.6"/>
    <rect x="50" y="-25" width="12" height="25" rx="3" fill="url(#bar-gradient)" opacity="0.3"/>
    <rect x="75" y="-80" width="12" height="80" rx="3" fill="#facc15" />
    <rect x="100" y="-45" width="12" height="45" rx="3" fill="url(#bar-gradient)" opacity="0.5"/>
    <rect x="125" y="-65" width="12" height="65" rx="3" fill="url(#bar-gradient)" opacity="0.7"/>
    <rect x="150" y="-35" width="12" height="35" rx="3" fill="url(#bar-gradient)" opacity="0.4"/>
    <rect x="175" y="-50" width="12" height="50" rx="3" fill="url(#bar-gradient)" opacity="0.6"/>
    <rect x="200" y="-28" width="12" height="28" rx="3" fill="url(#bar-gradient)" opacity="0.3"/>
  </g>
  
  <line x1="130" y1="111" x2="360" y2="111" stroke="#2dd4bf" stroke-width="1.5" opacity="0.3"/>
</svg>
