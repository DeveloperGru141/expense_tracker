<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06101a" id="themeColorMeta">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Track expenses, monitor budgets, and export financial reports with ExpenseFlow.">
    <meta name="format-detection" content="telephone=no">
    <title>{% block title %}ExpenseFlow{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='icon-180x180.png') }}">
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=2.2.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
    <script src="{{ url_for('static', path='app.js') }}?v=2.2.0" defer></script>
    <script>if(localStorage.getItem("theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("themeColorMeta")&&(document.getElementById("themeColorMeta").content="#f0f4f8")}</script>
</head>
<body>
    <div class="app-shell">
        <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle navigation menu" type="button">&#9776;</button>

        <aside class="sidebar" id="sidebar" aria-label="Main navigation">
            <div class="brand-block">
                <p class="sidebar-kicker">Expense flow</p>
                <h1 class="sidebar-title">Control Center</h1>
                <p class="sidebar-copy">Track every income, review your habits, and keep each section of your money flow organized.</p>
            </div>

            <nav class="sidebar-nav" aria-label="Sidebar">
                {% for item in nav_items %}
                    <a
                        href="{{ item.path }}"
                        class="nav-link{% if active_page == item.name %} active{% endif %}"
                    >
                        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
                        <span>{{ item.name }}</span>
                    </a>
                {% endfor %}
            </nav>

            <button id="installApp" class="install-btn" hidden>Install App</button>

            <div class="sidebar-divider"></div>

            <button id="themeToggle" class="theme-toggle-btn" type="button" data-theme-toggle>
                <span id="themeIcon">☀</span>
                <span id="themeLabel">Light</span>
            </button>

            <form action="/logout" method="post" class="logout-form" data-exit="true">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="logout-button" data-exit="true">Sign Out</button>
            </form>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

        <main class="page" id="page" role="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
