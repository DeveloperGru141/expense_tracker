<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06101a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=2.0.1">
    <script src="{{ url_for('static', path='app.js') }}?v=2.0.1" defer></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand-block">
                <p class="sidebar-kicker">Expense Tracker</p>
                <h1 class="sidebar-title">Control Center</h1>
                <p class="sidebar-copy">Track every naira, review your habits, and keep each section of your money flow organized.</p>
            </div>

            <nav class="sidebar-nav" aria-label="Sidebar">
                {% for item in nav_items %}
                    <a
                        href="{{ item.path }}"
                        class="nav-link{% if active_page == item.name %} active{% endif %}"
                    >
                        {{ item.name }}
                    </a>
                {% endfor %}
            </nav>

            <form action="/logout" method="post" class="logout-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="logout-button">Sign Out</button>
            </form>
        </aside>

        <main class="page">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
