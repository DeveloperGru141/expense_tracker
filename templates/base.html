<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06060e" id="themeColorMeta">
<meta name="description" content="{% block meta_desc %}Expense tracker{% endblock %}">
<title>{% block title %}FinFlow{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
<link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=3.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
<script src="{{ url_for('static', path='app.js') }}?v=3.0" defer></script>
<script>if(localStorage.getItem("theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("themeColorMeta")&&(document.getElementById("themeColorMeta").content="#f4f4f9")}</script>
</head>
<body>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">&#9776;</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">F</div>
        <div class="sidebar-brand">Fin<span>Flow</span></div>
      </div>
      <nav class="sidebar-nav">
        {% for item in nav_items %}
        <a href="{{ item.path }}" class="nav-link {% if active_page == item.path %}active{% endif %}" data-nav>
          <span class="nav-icon">{{ item.icon }}</span>
          {{ item.name }}
        </a>
        {% endfor %}
      </nav>
      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" data-theme-toggle>
          <span class="nav-icon">
            <span id="themeIcon">&#9790;</span>
          </span>
          <span id="themeLabel">Light Mode</span>
        </button>
        <form action="/logout" method="post" id="logoutForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="button" class="logout-btn" id="logoutBtn">
            <span class="nav-icon">&#10149;</span>
            Sign Out
          </button>
        </form>
      </div>
    </aside>

    <main class="page">
      <div class="page-content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
