<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06101a">
    <meta name="description" content="Sign in to your ExpenseFlow workspace to track and manage expenses.">
    <title>Sign In | ExpenseFlow</title>
    <link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=2.1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='landing-build/landing-galaxy.css') }}">
    <script src="{{ url_for('static', path='app.js') }}?v=2.1.0" defer></script>
    <script type="module" src="{{ url_for('static', path='landing-build/landing-galaxy.js') }}"></script>
</head>
<body class="login-page">
    <div id="landing-galaxy-root" aria-hidden="true"></div>
    <main class="login-shell" style="position: relative; z-index: 1;">
        <section class="login-copy">
            <a href="/" class="landing-brand">ExpenseFlow</a>
            <p class="landing-kicker">Secure workspace</p>
            <h1 class="login-title">Sign in to your expense command center.</h1>
            <p class="landing-subtext">Review spending, add entries, export reports, and keep your finance workspace behind a simple access gate.</p>
        </section>

        <section class="login-panel">
            <h2>Welcome back</h2>
            {% if error %}
                <p class="form-error" style="color: var(--danger); margin-bottom: 1rem;">{{ error }}</p>
            {% endif %}
            <form action="/login" method="post" class="expense-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next_url" value="{{ next_url }}">
                <label>
                    <span>Email</span>
                    <input type="email" name="email" placeholder="Your email address" autocomplete="email" required>
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" name="password" placeholder="Your password" autocomplete="current-password" maxlength="72" required>
                </label>
                <button type="submit">Sign In</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center; color: var(--muted);">
                Don't have an account? <a href="/register" class="text-link">Register now</a>
            </p>
        </section>
    </main>
</body>
</html>
