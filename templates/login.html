<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06101a" id="themeColorMeta">
    <meta name="description" content="Sign in to your ExpenseFlow workspace to track and manage expenses.">
    <title>Sign In | ExpenseFlow</title>
    <link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=2.3.0">
    <script src="{{ url_for('static', path='app.js') }}?v=2.3.0" defer></script>
    <script>if(localStorage.getItem("theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("themeColorMeta")&&(document.getElementById("themeColorMeta").content="#eef2f7")}</script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-copy">
            <div class="login-brand-block">
                <div class="login-brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                </div>
                <a href="/" class="landing-brand">ExpenseFlow</a>
            </div>
            <p class="landing-kicker">Secure workspace</p>
            <h1 class="login-title">Sign in to your expense command center.</h1>
            <p class="landing-subtext">Review spending, add entries, export reports, and keep your finance workspace behind a simple access gate.</p>
        </section>

        <section class="login-panel">
            <h2>Welcome back</h2>
            {% if error %}
                <p class="form-error">{{ error }}</p>
            {% endif %}
            <form action="/login" method="post" class="expense-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next_url" value="{{ next_url }}">
                <label>
                    <span>Email</span>
                    <input type="email" name="email" value="{{ email or '' }}" placeholder="Your email address" autocomplete="email" required>
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" name="password" placeholder="Your password" autocomplete="current-password" maxlength="72" required>
                </label>
                <button type="submit">Sign In</button>
            </form>
            <p style="margin-top: 1.5rem; text-align: center; color: var(--muted);">
                Don't have an account? <a href="/register" class="text-link">Register now</a>
            </p>
            <p style="margin-top: 0.5rem; text-align: center;">
                <button id="themeToggle" class="theme-toggle-link" type="button" data-theme-toggle>Toggle theme</button>
            </p>
        </section>
    </main>
</body>
</html>
