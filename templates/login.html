<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b14" id="themeColorMeta">
    <meta name="description" content="Sign in to your ExpenseFlow workspace to track and manage expenses.">
    <title>Sign In | ExpenseFlow</title>
    <link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}?v=3.0.0">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=3.0.0">
    <script src="{{ url_for('static', path='app.js') }}?v=3.0.0" defer></script>
    <script>if(localStorage.getItem("theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("themeColorMeta")&&(document.getElementById("themeColorMeta").content="#f0f4f8")}</script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-logo">EF</div>
        <h1>Welcome back</h1>
        <p>Sign in to your expense command center.</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/login" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="next_url" value="{{ next_url }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-input" value="{{ email or '' }}" placeholder="Your email address" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-input" placeholder="Your password" autocomplete="current-password" maxlength="72" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:11px 20px;">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/register">Register now</a>
        </p>
        <p style="margin-top:8px;text-align:center;">
            <button id="themeToggle" class="btn btn-ghost btn-sm" type="button" data-theme-toggle>Toggle theme</button>
        </p>
    </main>
</body>
</html>
