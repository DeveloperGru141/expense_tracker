<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06101a">
    <title>Login | Expense Tracker</title>
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-copy">
            <a href="/" class="landing-brand">ExpenseFlow</a>
            <p class="landing-kicker">Secure workspace</p>
            <h1 class="login-title">Sign in to your expense command center.</h1>
            <p class="landing-subtext">Review spending, add entries, export reports, and keep your finance workspace behind a simple access gate.</p>
        </section>

        <section class="login-panel">
            <h2>Welcome back</h2>
            {% if error %}
                <p class="form-error">{{ error }}</p>
            {% endif %}
            <form action="/login" method="post" class="expense-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next_url" value="{{ next_url }}">
                <label>
                    <span>Username</span>
                    <input type="text" name="username" value="admin" autocomplete="username" required>
                </label>
                <label>
                    <span>Password</span>
                    <input type="password" name="password" placeholder="expense123" autocomplete="current-password" required>
                </label>
                <button type="submit">Sign In</button>
            </form>
            <p class="login-hint">Default local login: admin / expense123</p>
        </section>
    </main>
</body>
</html>
