<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06060e" id="themeColorMeta">
<title>Sign In | FinFlow</title>
<link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=3.0">
<script src="{{ url_for('static', path='app.js') }}?v=3.0" defer></script>
<script>if(localStorage.getItem("theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("themeColorMeta")&&(document.getElementById("themeColorMeta").content="#f4f4f9")}</script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">F</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your FinFlow workspace</p>
    </div>
    <div class="auth-card">
      {% if error %}<p class="form-error" style="margin-bottom:16px;text-align:center">{{ error }}</p>{% endif %}
      {% if info %}<p class="flash-banner" style="margin-bottom:16px;text-align:center">{{ info }}</p>{% endif %}
      <form action="/login" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next_url" value="{{ next_url }}">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" value="{{ email or '' }}" placeholder="your@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" maxlength="72" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <p class="auth-link">Don't have an account? <a href="/register">Create one</a></p>
    </div>
  </div>
</body>
</html>
