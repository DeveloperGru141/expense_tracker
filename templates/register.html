<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b14" id="themeColorMeta">
    <meta name="description" content="Create your ExpenseFlow account to start tracking expenses and managing budgets.">
    <title>Register | ExpenseFlow</title>
    <link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
    <link rel="manifest" href="{{ url_for('static', path='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}?v=3.0.0">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=3.0.0">
    <script src="{{ url_for('static', path='app.js') }}?v=3.0.0" defer></script>
    <script>if(localStorage.getItem("theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("themeColorMeta")&&(document.getElementById("themeColorMeta").content="#f0f4f8")}</script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-logo">EF</div>
        <h1>Get Started</h1>
        <p>Create your professional expense account.</p>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form action="/register" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-input" value="{{ email or '' }}" placeholder="Your email address" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-input" placeholder="Create a password" autocomplete="new-password" maxlength="72" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" class="form-input" placeholder="Repeat your password" autocomplete="new-password" maxlength="72" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:11px 20px;">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Sign In</a>
        </p>
    </main>
</body>
</html>
