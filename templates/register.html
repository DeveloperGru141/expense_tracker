<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06060e" id="themeColorMeta">
<title>Create Account | FinFlow</title>
<link rel="icon" href="{{ url_for('static', path='images/calculator.png') }}" type="image/png">
<link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=3.0">
<script src="{{ url_for('static', path='app.js') }}?v=3.0" defer></script>
<script>if(localStorage.getItem("theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("themeColorMeta")&&(document.getElementById("themeColorMeta").content="#f4f4f9")}</script>
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">F</div>
      <h1 class="auth-title">Get started</h1>
      <p class="auth-subtitle">Create your FinFlow account</p>
    </div>
    <div class="auth-card">
      {% if error %}<p class="form-error" style="margin-bottom:16px;text-align:center">{{ error }}</p>{% endif %}
      <form action="/register" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" value="{{ email or '' }}" placeholder="your@email.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Create a password (min 8 chars)" autocomplete="new-password" maxlength="72" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input class="form-input" type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" autocomplete="new-password" maxlength="72" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
      </form>
      <p class="auth-link">Already have an account? <a href="/login">Sign In</a></p>
    </div>
  </div>
</body>
</html>
